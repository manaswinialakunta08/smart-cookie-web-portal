<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Smart Cookie</title>

    <style>

        :root {
            --background: #f5f7fb;
            --card: #ffffff;
            --text: #25263a;
            --muted: #77798f;
            --primary: #6c63ff;
            --primary-dark: #5148d8;
            --border: #e6e6ef;
            --header: #ffffff;
        }

        body.dark-theme {
            --background: #11121c;
            --card: #1d1e2b;
            --text: #f5f5f7;
            --muted: #aaaabd;
            --primary: #817aff;
            --primary-dark: #6259e8;
            --border: #333447;
            --header: #181925;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 20px 50px;

            background: var(--header);
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 22px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        nav a:hover {
            color: var(--primary);
        }

        #themeToggle {
            border: none;

            background: var(--primary);
            color: white;

            padding: 10px 15px;

            border-radius: 8px;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        #themeToggle:hover {
            background: var(--primary-dark);
        }

        main {
            min-height: calc(100vh - 80px);

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 60px 20px;
        }

        .dashboard-card {
            width: 100%;
            max-width: 850px;

            background: var(--card);

            padding: 40px;

            border-radius: 18px;

            border: 1px solid var(--border);

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .dashboard-card h2 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .dashboard-card > p {
            color: var(--muted);

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 35px;
        }

        .user-info {
            padding: 25px;

            border-radius: 12px;

            background: var(--background);

            border: 1px solid var(--border);
        }

        .user-info h3 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .user-info p {
            display: flex;
            justify-content: space-between;

            padding: 14px 0;

            border-bottom: 1px solid var(--border);

            font-size: 14px;
        }

        .user-info p:last-child {
            border-bottom: none;
        }

        .user-info span {
            color: var(--muted);
        }

        @media (max-width: 800px) {

            header {
                padding: 18px 25px;
            }

            header h1 {
                font-size: 18px;
            }

            nav {
                gap: 12px;
            }

            main {
                padding: 30px 15px;
            }

            .dashboard-card {
                padding: 25px;
            }

        }

        @media (max-width: 550px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .user-info p {
                flex-direction: column;
                gap: 5px;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>
            🍪 Smart Cookie Web Portal
        </h1>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="profile.html">
                Profile
            </a>

            <button
                type="button"
                id="themeToggle">
                🌙 Dark Mode
            </button>

            <a href="logout">
                Logout
            </a>

        </nav>

    </header>


    <main>

        <section class="dashboard-card">

            <h2>
                Welcome to your Dashboard 👋
            </h2>

            <p>
                You have successfully logged in to the
                Smart Cookie Web Portal.
            </p>

            <div class="user-info">

                <h3>
                    User Information
                </h3>

                <p>
                    <strong>User ID:</strong>
                    <span>Loading...</span>
                </p>

                <p>
                    <strong>Name:</strong>
                    <span>Loading...</span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span>Loading...</span>
                </p>

                <p>
                    <strong>Role:</strong>
                    <span>Loading...</span>
                </p>

            </div>

        </section>

    </main>


    <script>

        const themeToggle =
            document.getElementById("themeToggle");


        function setThemeCookie(theme) {

            document.cookie =
                "theme=" +
                theme +
                "; max-age=" +
                (30 * 24 * 60 * 60) +
                "; path=/";

        }


        function getThemeCookie() {

            const cookies =
                document.cookie.split(";");

            for (let cookie of cookies) {

                cookie = cookie.trim();

                if (cookie.startsWith("theme=")) {

                    return cookie.substring(
                        "theme=".length
                    );

                }

            }

            return null;

        }


        function applyTheme(theme) {

            if (theme === "dark") {

                document.body.classList.add(
                    "dark-theme"
                );

                themeToggle.textContent =
                    "☀️ Light Mode";

            } else {

                document.body.classList.remove(
                    "dark-theme"
                );

                themeToggle.textContent =
                    "🌙 Dark Mode";

            }

        }


        const savedTheme =
            getThemeCookie();


        if (savedTheme) {

            applyTheme(savedTheme);

        } else {

            applyTheme("light");

        }


        themeToggle.addEventListener(
            "click",
            function () {

                if (
                    document.body.classList.contains(
                        "dark-theme"
                    )
                ) {

                    setThemeCookie("light");

                    applyTheme("light");

                } else {

                    setThemeCookie("dark");

                    applyTheme("dark");

                }

            }
        );

    </script>

</body>

</html>
